# Heartland Network — production deployment
# Zero-config: `docker compose pull && docker compose up -d` is all you need.
# No .env file is required — every setting has a safe default.
# Optional overrides (export in your shell before `docker compose up`, or use a
# .env file if you prefer):
#   HEARTLAND_PORT, HEARTLAND_IMAGE, POSTGRES_USER, POSTGRES_PASSWORD,
#   POSTGRES_DB, TICK_MS, MAX_GAMES, ADMIN_TOKEN
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heartland}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heartland}
      POSTGRES_DB: ${POSTGRES_DB:-heartland}
    volumes:
      - heartland_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heartland} -d ${POSTGRES_DB:-heartland}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - heartland
    # PostgreSQL is never exposed to the host network.

  app:
    image: ${HEARTLAND_IMAGE:-ghcr.io/atvriders/heartland-network:1.0.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-heartland}:${POSTGRES_PASSWORD:-heartland}@db:5432/${POSTGRES_DB:-heartland}
      HOST: 0.0.0.0
      PORT: 8080
      TICK_MS: ${TICK_MS:-1000}
      MAX_GAMES: ${MAX_GAMES:-12}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "${HEARTLAND_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - heartland

networks:
  heartland:
    driver: bridge

volumes:
  heartland_db:
